{% extends "base.html" %}

{% block content %}

<!-- ── OVERVIEW TAB ─────────────────────────────────────────── -->
<section id="tab-overview" class="tab-section">

  <!-- KPI cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
    <div class="bg-white rounded-xl border border-gray-200 p-5">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">This Month</p>
      <p class="text-2xl font-semibold text-gray-900" id="kpi-this-month">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-5">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Last Month</p>
      <p class="text-2xl font-semibold text-gray-900" id="kpi-last-month">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-5">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">3-Month Avg</p>
      <p class="text-2xl font-semibold text-gray-900" id="kpi-avg">—</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-5">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Top Category</p>
      <p class="text-lg font-semibold text-gray-900 truncate" id="kpi-top-cat">—</p>
    </div>
  </div>

  <!-- Monthly bar chart -->
  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <h2 class="text-sm font-semibold text-gray-700 mb-4">Monthly Spending</h2>
    <div id="chart-monthly" class="w-full" style="height:320px"></div>
  </div>

</section>


<!-- ── CATEGORIES TAB ──────────────────────────────────────── -->
<section id="tab-categories" class="tab-section hidden">

  <div class="flex items-center gap-3 mb-6">
    <label class="text-sm font-medium text-gray-600">Month</label>
    <select id="cat-month-select" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-accent-500">
      <option value="">All time</option>
    </select>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <h2 class="text-sm font-semibold text-gray-700 mb-4">Breakdown</h2>
      <div id="chart-cat-donut" class="w-full" style="height:300px"></div>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 p-6">
      <h2 class="text-sm font-semibold text-gray-700 mb-4">By Category</h2>
      <div id="chart-cat-bar" class="w-full" style="height:300px"></div>
    </div>
  </div>

</section>


<!-- ── TRENDS TAB ──────────────────────────────────────────── -->
<section id="tab-trends" class="tab-section hidden">

  <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6">
    <div class="flex flex-wrap items-start gap-4 mb-5">
      <div class="flex-1 min-w-48">
        <label class="block text-xs font-medium text-gray-500 mb-1.5">Categories</label>
        <div id="trends-cat-pills" class="flex flex-wrap gap-2"></div>
      </div>
      <div class="flex gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">From</label>
          <select id="trends-start" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-accent-500"></select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1.5">To</label>
          <select id="trends-end" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-accent-500"></select>
        </div>
      </div>
    </div>
    <div id="chart-trends" class="w-full" style="height:360px"></div>
  </div>

</section>


<!-- ── TRANSACTIONS TAB ────────────────────────────────────── -->
<section id="tab-transactions" class="tab-section hidden">

  <!-- Filters -->
  <div class="flex flex-wrap gap-3 mb-5">
    <input id="txn-search" type="text" placeholder="Search merchant…"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white w-48 focus:outline-none focus:ring-2 focus:ring-accent-500" />
    <select id="txn-cat-filter" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-accent-500">
      <option value="">All categories</option>
    </select>
    <select id="txn-month-filter" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-accent-500">
      <option value="">All months</option>
    </select>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100 text-left">
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Merchant</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden sm:table-cell">Category</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell">Account</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Amount</th>
        </tr>
      </thead>
      <tbody id="txn-tbody" class="divide-y divide-gray-50"></tbody>
    </table>

    <!-- Pagination -->
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <p class="text-xs text-gray-500" id="txn-count"></p>
      <div class="flex gap-2">
        <button id="txn-prev" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
        <button id="txn-next" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
      </div>
    </div>
  </div>

</section>

{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
