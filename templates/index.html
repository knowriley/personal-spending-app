{% extends "base.html" %}

{% block content %}

<!-- ── OVERVIEW TAB ────────────────────────────────────────────── -->
<section id="section-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0" class="hidden focus:outline-none">
  <!-- v2: single-column stack — snapshot, cumulative chart, top categories. -->
  <div class="flex flex-col gap-4 max-w-2xl">
    <div id="overview-card1"></div>
    <div id="overview-chart-card" class="bg-white border border-neutral-200 rounded-lg p-4 sm:p-6"></div>
    <div id="overview-card4"></div>
  </div>
</section>


<!-- ── HABITS TAB (formerly Dashboard) ─────────────────────────── -->
<section id="section-habits" role="tabpanel" aria-labelledby="tab-habits" tabindex="0" class="hidden focus:outline-none">

<!-- ── Two-pane: chart (left) + month drill-down (right). At ≥1024px both show
     side-by-side, 50/50; below that the right pane is the off-screen home and the
     drill-down opens as a flyout on bar click (openDrillDownFlyout). -->
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start mb-6">

  <!-- Left: chart card. Also the flyout's compressTarget on narrow. -->
  <div id="habits-explorer" class="min-w-0">

    <!-- Chart card -->
    <div id="habits-chart-card" class="bg-white rounded-lg border border-neutral-200 p-6 sm:p-8">

    <!-- Chart card header -->
    <div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-start sm:gap-6">
      <div class="min-w-0 flex-1">
        <h2 id="habits-chart-title" class="text-2xl font-semibold text-neutral-900 leading-tight">All Spending Over Last 12 Months</h2>
        <p id="habits-chart-subtitle" class="text-sm text-neutral-500 mt-1"></p>
      </div>
      <div id="habits-chart-controls" class="flex items-center gap-2 flex-wrap">

        <!-- Chart range picker — bar mode only; hidden when chartType === 'radial' -->
        <div class="relative" id="s1-window-dropdown">
          <button id="s1-window-btn" type="button"
            class="flex items-center gap-2 text-xs font-semibold text-neutral-700 border border-neutral-300 rounded-lg px-3 py-2 bg-white shadow-sm hover:bg-neutral-50 focus:outline-none focus:ring-2 focus:ring-accent-700">
            <span id="s1-window-label">Last 12 months</span>
            <svg class="w-3.5 h-3.5 text-neutral-400 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
          <div id="s1-window-panel"
            class="hidden absolute right-0 z-20 mt-1 min-w-[12rem] bg-white border border-neutral-200 rounded-xl shadow-lg py-1"></div>
        </div>

        <!-- Year multi-select — radial mode only; replaces the timeframe pill when chartType === 'radial' -->
        <div class="relative hidden" id="radial-year-dropdown">
          <button id="radial-year-btn" type="button"
            class="flex items-center gap-2 text-xs font-semibold text-neutral-700 border border-neutral-300 rounded-lg px-3 py-2 bg-white shadow-sm hover:bg-neutral-50 focus:outline-none focus:ring-2 focus:ring-accent-700">
            <span id="radial-year-label">All years</span>
            <svg class="w-3.5 h-3.5 text-neutral-400 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
          <div id="radial-year-panel"
            class="hidden absolute right-0 z-20 mt-1 min-w-[10rem] bg-white border border-neutral-200 rounded-xl shadow-lg py-1"></div>
        </div>

        <!-- Bar ↔ Radial chart-type toggle — desktop only (≥768px) -->
        <div id="habits-charttype-toggle" role="group" aria-label="Chart type"
             class="hidden md:inline-flex rounded-lg border border-neutral-300 overflow-hidden text-xs shadow-sm">
          <button data-charttype="bar" type="button" aria-pressed="true" aria-label="Bar chart" title="Bar chart"
            class="habits-charttype-btn px-2.5 py-2 bg-neutral-100 text-neutral-900 inline-flex items-center justify-center">
            <svg class="w-4 h-4" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <rect x="2"  y="9" width="3" height="5"  rx="0.5"/>
              <rect x="6.5" y="5" width="3" height="9"  rx="0.5"/>
              <rect x="11" y="2" width="3" height="12" rx="0.5"/>
            </svg>
          </button>
          <button data-charttype="radial" type="button" aria-pressed="false" aria-label="Radial chart" title="Radial chart"
            class="habits-charttype-btn px-2.5 py-2 text-neutral-500 hover:bg-neutral-50 inline-flex items-center justify-center">
            <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <circle cx="8" cy="8" r="6"/>
              <circle cx="8" cy="8" r="3"/>
              <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>

        <!-- Total ↔ Stacked-by-parent view toggle (bar mode only; meaningful when scope=all|parent) -->
        <div id="habits-view-toggle" role="group" aria-label="Chart view"
             class="flex rounded-lg border border-neutral-300 overflow-hidden text-xs shadow-sm">
          <button data-view="total" type="button" aria-pressed="true"
            class="habits-view-btn px-3 py-2 font-semibold bg-neutral-100 text-neutral-900">Total</button>
          <button data-view="stacked" type="button" aria-pressed="false"
            class="habits-view-btn px-3 py-2 font-semibold text-neutral-500 hover:bg-neutral-50">Stacked</button>
        </div>

      </div>
    </div>

    <div id="chart-monthly" class="w-full" style="height:420px"></div>
    <div id="chart-radial" class="w-full hidden" style="height:420px"></div>
    </div><!-- /habits-chart-card -->

  </div><!-- /habits-explorer (chart pane) -->

  <!-- Right: month drill-down. Visible side-by-side at ≥1024px; below that it's
       hidden and serves as the off-screen home — #cat-drilldown-section is
       re-parented into the flyout on bar click and moved back here on dismiss. -->
  <div id="habits-drilldown" class="hidden lg:block min-w-0">
    <div id="cat-drilldown-section"></div>
  </div>

</div><!-- /two-pane grid -->


</section><!-- /section-habits -->


<!-- ── TRANSACTIONS TAB (hidden by default) ───────────────────── -->
<section id="section-transactions" role="tabpanel" aria-labelledby="tab-transactions" tabindex="0" class="hidden focus:outline-none">

  <!-- Readable column — the list doesn't need the full 1600px content width. -->
  <div class="max-w-5xl">

    <!-- Search (always visible) + filters. Desktop: inline category + month.
         Mobile: a Filter button opens #txn-filter-controls in a bottom sheet. -->
    <div class="flex items-center gap-3 mb-5">
      <label for="txn-search" class="sr-only">Search merchant</label>
      <input id="txn-search" type="text" placeholder="Search merchant…"
        class="flex-1 md:flex-none md:w-64 text-sm border border-neutral-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-accent-700" />

      <div id="txn-filter-controls" class="hidden md:flex md:items-center md:gap-3">
        <label for="txn-cat-filter" class="sr-only">Filter by category</label>
        <select id="txn-cat-filter"
          class="text-sm border border-neutral-200 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-accent-700">
          <option value="">All categories</option>
        </select>
        <label for="txn-month-filter" class="sr-only">Filter by month</label>
        <input id="txn-month-filter" type="month"
          class="text-sm border border-neutral-200 rounded-lg px-3 py-2 bg-white text-neutral-900 focus:outline-none focus:ring-2 focus:ring-accent-700" />
      </div>

      <button id="txn-filter-btn" type="button"
        class="md:hidden inline-flex items-center text-sm font-medium px-4 py-2 rounded-lg border border-neutral-200 bg-white text-neutral-700 hover:bg-neutral-50 focus:outline-none focus:ring-2 focus:ring-accent-700">
        Filter<span id="txn-filter-badge" class="hidden ml-1 bg-accent-100 text-accent-700 text-xs font-semibold rounded-full px-1.5 py-0.5"></span>
      </button>
    </div>

    <!-- Month-grouped list + "Load older" (both populated by renderTransactions). -->
    <div id="txn-list"></div>
    <div id="txn-load-older-wrap" class="text-center pt-2 pb-12"></div>

  </div>

</section><!-- /section-transactions -->


{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
