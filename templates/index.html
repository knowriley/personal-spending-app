{% extends "base.html" %}

{% block content %}

<!-- ── OVERVIEW TAB ────────────────────────────────────────────── -->
<section id="section-overview" class="hidden">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    <div id="overview-card1"></div>
    <div id="overview-card2"></div>
    <div id="overview-card3"></div>
    <div id="overview-card4"></div>
  </div>
  <div id="overview-chart-card" class="bg-white border border-gray-200 rounded-lg p-4 sm:p-6"></div>
</section>


<!-- ── HABITS TAB (formerly Dashboard) ─────────────────────────── -->
<section id="section-habits" class="hidden">

<!-- ── Habits explorer: KPI + chart stacked, scope nav lives in the page-header chip -->
<div id="habits-explorer" class="mb-12">

  <div class="flex flex-col gap-6 min-w-0">

    <!-- KPI card — values re-render against the active scope (all / parent / leaf) -->
    <div id="habits-kpi-card" class="bg-white rounded-xl border border-gray-200 p-5 sm:p-6">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 sm:gap-6">
        <div class="min-w-0">
          <p id="kpi-this-month-label" class="text-xs font-medium text-gray-400 uppercase tracking-wide">This Month</p>
          <p id="kpi-this-month" class="text-2xl font-semibold text-gray-900 tabular-nums mt-1 truncate">—</p>
        </div>
        <div class="min-w-0">
          <p id="kpi-last-month-label" class="text-xs font-medium text-gray-400 uppercase tracking-wide">Last Month</p>
          <p id="kpi-last-month" class="text-2xl font-semibold text-gray-900 tabular-nums mt-1 truncate">—</p>
        </div>
        <div class="min-w-0">
          <p id="kpi-avg-label" class="text-xs font-medium text-gray-400 uppercase tracking-wide">12-Mo Avg</p>
          <p id="kpi-avg" class="text-2xl font-semibold text-gray-900 tabular-nums mt-1 truncate">—</p>
        </div>
        <div class="min-w-0">
          <p id="kpi-top-cat-label" class="text-xs font-medium text-gray-400 uppercase tracking-wide">Top Category</p>
          <p id="kpi-top-cat" class="text-2xl font-semibold text-gray-900 mt-1 truncate">—</p>
        </div>
      </div>
    </div>

    <!-- Chart card -->
    <div id="habits-chart-card" class="bg-white rounded-xl border border-gray-200 p-6 sm:p-8">

    <!-- Chart card header -->
    <div class="flex flex-col gap-4 mb-6 sm:flex-row sm:items-start sm:gap-6">
      <div class="min-w-0 flex-1">
        <nav id="habits-breadcrumbs" class="flex items-center flex-wrap gap-1 text-xs font-medium text-gray-400 mb-1"></nav>
        <h2 id="habits-chart-title" class="text-2xl font-semibold text-gray-900 leading-tight">All Spending Over Last 12 Months</h2>
        <p id="habits-chart-subtitle" class="text-sm text-gray-500 mt-1"></p>
      </div>
      <div id="habits-chart-controls" class="flex items-center gap-2 flex-wrap">

        <!-- Chart range picker — drives the trend chart only -->
        <div class="relative" id="s1-window-dropdown">
          <button id="s1-window-btn" type="button"
            class="flex items-center gap-2 text-xs font-semibold text-gray-700 border border-gray-300 rounded-lg px-3 py-2 bg-white shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-accent-500">
            <span id="s1-window-label">Last 12 months</span>
            <svg class="w-3.5 h-3.5 text-gray-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/>
            </svg>
          </button>
          <div id="s1-window-panel"
            class="hidden absolute right-0 z-20 mt-1 min-w-[12rem] bg-white border border-gray-200 rounded-xl shadow-lg py-1"></div>
        </div>

        <!-- Total ↔ Stacked-by-parent view toggle (only meaningful when scope=all) -->
        <div id="habits-view-toggle" class="flex rounded-lg border border-gray-300 overflow-hidden text-xs shadow-sm">
          <button data-view="total" type="button"
            class="habits-view-btn px-3 py-2 font-semibold bg-accent-50 text-accent-700">Total</button>
          <button data-view="stacked" type="button"
            class="habits-view-btn px-3 py-2 font-semibold text-gray-500 hover:bg-gray-50">Stacked</button>
        </div>

      </div>
    </div>

    <div id="chart-monthly" class="w-full" style="height:420px"></div>
    </div><!-- /habits-chart-card -->

  </div><!-- /chart column wrapper -->

</div><!-- /habits-explorer -->


<!-- ── Drill-down (always rendered; scope-aware contents) ────── -->
<div id="habits-drilldown" class="mb-12">
  <div id="cat-drilldown-section"></div>
</div>


<!-- Radial markup retained but unreachable; future PRD will surface it. -->
<div id="s1-radial-content" class="hidden">
  <select id="radial-cat-select"><option value="">All spending</option></select>
  <div id="radial-year-dropdown"><button id="radial-year-btn"><span id="radial-year-label"></span></button>
    <div id="radial-year-panel" class="hidden"></div></div>
  <div id="chart-radial"></div>
</div>

</section><!-- /section-habits -->


<!-- ── TRANSACTIONS TAB (hidden by default) ───────────────────── -->
<section id="section-transactions" class="hidden">

  <!-- Filters -->
  <div class="flex flex-wrap gap-3 mb-5">
    <input id="txn-search" type="text" placeholder="Search merchant…"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white w-48 focus:outline-none focus:ring-2 focus:ring-accent-500" />
    <select id="txn-cat-filter"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-accent-500">
      <option value="">All categories</option>
    </select>
    <input id="txn-month-filter" type="month"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 bg-white text-gray-900 focus:outline-none focus:ring-2 focus:ring-accent-500" />
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-gray-100 text-left">
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Merchant</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden sm:table-cell">Category</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide hidden md:table-cell">Account</th>
          <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Amount</th>
        </tr>
      </thead>
      <tbody id="txn-tbody" class="divide-y divide-gray-50"></tbody>
    </table>
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <p class="text-xs text-gray-500" id="txn-count"></p>
      <div class="flex gap-2">
        <button id="txn-prev" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
        <button id="txn-next" class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
      </div>
    </div>
  </div>

</section><!-- /section-transactions -->


{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
{% endblock %}
