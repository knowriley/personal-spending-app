<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spending</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            accent: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

  <!-- App styles (Plotly overrides) -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen">

  <!-- Top nav -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <span class="font-semibold text-gray-800 tracking-tight">Spending</span>
      <nav class="flex gap-1" id="tab-nav">
        <button data-tab="overview"      class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Overview</button>
        <button data-tab="categories"    class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Categories</button>
        <button data-tab="trends"        class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Trends</button>
        <button data-tab="transactions"  class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Transactions</button>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
