<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spending</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            accent: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased h-full flex flex-col overflow-hidden">

  <!-- Top nav -->
  <header class="bg-white border-b border-gray-200 shrink-0 z-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
      <span class="font-semibold text-gray-800 tracking-tight">Spending</span>
      <nav class="flex gap-1" id="tab-nav">
        <button data-tab="overview"      class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Overview</button>
        <button data-tab="categories"    class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Categories</button>
        <button data-tab="trends"        class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Trends</button>
        <button data-tab="transactions"  class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Transactions</button>
        <button data-tab="radial"        class="tab-btn px-3 py-1.5 text-sm font-medium rounded-md transition-colors">Radial</button>
      </nav>
    </div>
  </header>

  <!-- Layout: scrollable main + slide-in panel -->
  <div class="flex flex-1 overflow-hidden">

    <main id="app-main" class="flex-1 overflow-y-auto min-w-0">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Transaction side panel — pushed layout, 33vw when open -->
    <aside id="txn-panel" class="shrink-0 overflow-hidden border-l border-gray-200 bg-white flex flex-col">
      <div class="txn-panel-inner h-full flex flex-col">

        <!-- Header -->
        <div class="flex items-start justify-between px-5 py-4 border-b border-gray-100 shrink-0">
          <div>
            <p id="txn-panel-title" class="font-semibold text-gray-900 text-sm"></p>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span id="txn-panel-color-dot" class="inline-block w-2 h-2 rounded-full shrink-0"></span>
              <p id="txn-panel-meta" class="text-xs text-gray-400"></p>
            </div>
          </div>
          <button id="txn-panel-close" class="ml-4 mt-0.5 text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
            </svg>
          </button>
        </div>

        <!-- Callout total -->
        <div class="px-5 pt-5 pb-4 border-b border-gray-100 shrink-0">
          <p id="txn-panel-callout" class="text-3xl font-bold text-gray-900 tabular-nums tracking-tight"></p>
          <p class="text-xs text-gray-400 mt-1">total spent</p>
        </div>

        <!-- Table -->
        <div class="overflow-y-auto flex-1">
          <table class="w-full text-sm">
            <thead class="sticky top-0 bg-white border-b border-gray-100">
              <tr>
                <th class="px-5 py-2.5 text-left text-xs font-semibold text-gray-400 uppercase tracking-wide">Date</th>
                <th class="px-5 py-2.5 text-left text-xs font-semibold text-gray-400 uppercase tracking-wide">Merchant</th>
                <th class="px-5 py-2.5 text-right text-xs font-semibold text-gray-400 uppercase tracking-wide">Amount</th>
              </tr>
            </thead>
            <tbody id="txn-panel-tbody" class="divide-y divide-gray-50"></tbody>
          </table>
          <p id="txn-panel-empty" class="hidden text-center text-sm text-gray-400 py-12">No transactions found.</p>
        </div>

        <!-- Footer -->
        <div class="px-5 py-3 border-t border-gray-100 shrink-0 flex justify-between items-center">
          <span class="text-xs text-gray-400" id="txn-panel-count"></span>
          <span class="text-sm font-semibold text-gray-800" id="txn-panel-total"></span>
        </div>

      </div>
    </aside>

  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
