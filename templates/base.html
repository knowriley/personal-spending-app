<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyHabits</title>

  <!-- Tailwind CSS (built locally) -->
  <link rel="stylesheet" href="/static/css/tailwind.css" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Chart.js 4.x (vendored locally) + datalabels plugin (donut slice labels).
       datalabels must load after Chart.js; all of these must precede app.js.
       The Habits radial chart is hand-rolled SVG (radial.js) — no chart library. -->
  <script src="/static/js/chart.umd.min.js"></script>
  <script src="/static/js/chartjs-plugin-datalabels.min.js"></script>
  <script src="/static/js/radial.js"></script>
  <!-- iOS interaction primitives (bottom sheet, large-title scroll). Must load
       before app.js, which calls window.MoneyHabitsIOS at boot. -->
  <script src="/static/js/ios.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased h-full overflow-hidden md:flex">

  <!-- ── Desktop left side rail (≥768px) ─────────────────────────────────── -->
  <!-- data-collapsed toggles the icons-only narrow state (56px). The state is
       persisted to localStorage['mh-rail-collapsed'] by initRailCollapse(). -->
  <nav id="side-rail" aria-label="Main sections" data-collapsed="false"
       class="hidden md:flex md:flex-col w-60 shrink-0 bg-white border-r border-neutral-200 z-40 py-3">
    <!-- Profile / dataset switcher (Notion-style) — shows the active persona;
         click opens #profile-panel. Populated by initProfileSwitcher(). -->
    <button type="button" id="profile-btn" aria-haspopup="true" aria-expanded="false"
      class="flex items-center gap-2.5 mx-2 mb-3 px-2.5 py-2 rounded-lg hover:bg-neutral-100 focus:outline-none focus:ring-2 focus:ring-accent-700">
      <span id="profile-badge" class="w-7 h-7 rounded-md bg-accent-100 text-accent-700 text-xs font-semibold flex items-center justify-center shrink-0" aria-hidden="true">·</span>
      <span id="profile-name" class="rail-collapsible flex-1 min-w-0 text-sm font-semibold text-neutral-800 truncate text-left">Dataset</span>
      <svg class="rail-collapsible w-4 h-4 text-neutral-400 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/></svg>
    </button>

    <button type="button" data-tab="overview" id="tab-overview" class="nav-btn rail-btn">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span class="nav-label rail-collapsible">Overview</span>
    </button>
    <button type="button" data-tab="habits" id="tab-habits" class="nav-btn rail-btn">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="12" width="4" height="8.5" rx="1"/><rect x="10" y="6" width="4" height="14.5" rx="1"/><rect x="16.5" y="9" width="4" height="11.5" rx="1"/></svg>
      <span class="nav-label rail-collapsible">Habits</span>
    </button>
    <button type="button" data-tab="transactions" id="tab-transactions" class="nav-btn rail-btn">
      <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      <span class="nav-label rail-collapsible">Transactions</span>
    </button>

    <!-- Collapse toggle — pinned to the bottom of the rail. Icon rotates 180°
         in the collapsed state via CSS (#side-rail[data-collapsed="true"]). -->
    <button type="button" id="rail-collapse-btn" aria-label="Collapse sidebar"
      class="mt-auto mx-2 mb-1 px-2.5 py-2 rounded-lg text-neutral-500 hover:bg-neutral-100 hover:text-neutral-700 inline-flex items-center justify-start gap-2.5 focus:outline-none focus:ring-2 focus:ring-accent-700">
      <svg class="w-5 h-5 shrink-0" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd" d="M12.78 5.22a.75.75 0 0 1 0 1.06L9.06 10l3.72 3.72a.75.75 0 1 1-1.06 1.06l-4.25-4.25a.75.75 0 0 1 0-1.06l4.25-4.25a.75.75 0 0 1 1.06 0Z"/>
      </svg>
      <span class="nav-label rail-collapsible text-xs">Collapse</span>
    </button>
  </nav>

  <!-- ── Main scroll area (offset by the rail on desktop) ─────────────────── -->
  <main id="app-scroll" class="flex-1 h-full overflow-y-auto min-w-0">

    <!-- Mobile sticky header — shrink target (#sticky-fade fades in on scroll)
         plus an always-visible profile badge. Hidden on desktop (the profile
         switcher lives at the top of the rail). -->
    <header id="sticky-header" class="md:hidden sticky top-0 z-30" style="padding-top: env(safe-area-inset-top);">
      <div class="relative h-12">
        <div id="sticky-fade" class="absolute inset-0 bg-white border-b border-neutral-200 flex items-center px-4">
          <span id="sticky-title" class="text-2xl font-semibold tracking-tight text-neutral-900 truncate">Overview</span>
        </div>
        <button type="button" id="profile-badge-mobile" aria-haspopup="true" aria-expanded="false" aria-label="Switch dataset"
          class="absolute right-2 top-1/2 -translate-y-1/2 z-10 rounded-md focus:outline-none focus:ring-2 focus:ring-accent-700">
          <span class="w-8 h-8 rounded-md bg-accent-100 text-accent-700 text-sm font-semibold flex items-center justify-center" aria-hidden="true">·</span>
        </button>
      </div>
    </header>

    <!-- Large-title block — shared, repopulated per tab by the header renderers.
         Mobile: fades + shrinks into the sticky bar on scroll (origin top-left).
         Desktop: a static large title that simply scrolls with content. -->
    <div id="large-title-block" class="max-w-[1600px] mx-auto px-4 sm:px-6 pt-4 md:pt-10 pb-4" style="transform-origin: left top;">
      <div class="relative inline-block">
        <h1 id="page-title" class="text-3xl font-bold tracking-tight text-neutral-900">Overview</h1>
        <!-- Habits-only category chip dropdown (anchored under the heading) -->
        <div id="hc-chip-panel"
             class="hidden absolute left-0 mt-2 min-w-[18rem] max-w-[calc(100vw-2rem)] max-h-[60vh] overflow-y-auto bg-white border border-neutral-200 rounded-xl shadow-lg z-30 py-2">
          <div id="hc-cat-panel-list" class="p-2"></div>
        </div>
      </div>
      <p id="page-subtitle" class="text-sm text-neutral-600 mt-1">&nbsp;</p>
    </div>

    <!-- Tab content (extra bottom padding clears the fixed mobile tab bar) -->
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 pb-28 md:pb-10">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- ── Mobile bottom tab bar (<768px) ──────────────────────────────────── -->
  <nav id="bottom-nav" aria-label="Main sections"
       class="md:hidden fixed inset-x-0 bottom-0 z-40 bg-white border-t border-neutral-200"
       style="padding-bottom: calc(env(safe-area-inset-bottom) + 8px);">
    <div class="flex">
      <button type="button" data-tab="overview" class="nav-btn bottom-btn flex-1">
        <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-label">Overview</span>
      </button>
      <button type="button" data-tab="habits" class="nav-btn bottom-btn flex-1">
        <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="12" width="4" height="8.5" rx="1"/><rect x="10" y="6" width="4" height="14.5" rx="1"/><rect x="16.5" y="9" width="4" height="11.5" rx="1"/></svg>
        <span class="nav-label">Habits</span>
      </button>
      <button type="button" data-tab="transactions" class="nav-btn bottom-btn flex-1">
        <svg class="nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        <span class="nav-label">Transactions</span>
      </button>
    </div>
  </nav>

  <!-- Transaction side panel — dormant (hidden). Kept for a future detail surface;
       openTxnPanel is currently unreferenced. -->
  <aside id="txn-panel" aria-label="Transaction details" class="hidden fixed inset-y-0 right-0 overflow-hidden border-l border-neutral-200 bg-white flex-col z-40">
    <div class="txn-panel-inner h-full flex flex-col">
      <div class="flex items-start justify-between px-5 py-4 border-b border-neutral-100 shrink-0">
        <div>
          <p id="txn-panel-title" class="font-semibold text-neutral-900 text-sm"></p>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span id="txn-panel-color-dot" class="inline-block w-2 h-2 rounded-full shrink-0"></span>
            <p id="txn-panel-meta" class="text-xs text-neutral-500"></p>
          </div>
        </div>
        <button id="txn-panel-close" type="button" aria-label="Close transaction panel"
          class="ml-2 -mt-1 -mr-1 p-2 text-neutral-500 hover:text-neutral-700 transition-colors focus:outline-none focus:ring-2 focus:ring-accent-700 rounded">
          <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M6.28 5.22a.75.75 0 0 0-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 1 0 1.06 1.06L10 11.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L11.06 10l3.72-3.72a.75.75 0 0 0-1.06-1.06L10 8.94 6.28 5.22Z"/>
          </svg>
        </button>
      </div>
      <div class="px-5 pt-5 pb-4 border-b border-neutral-100 shrink-0">
        <p id="txn-panel-callout" class="text-3xl font-bold text-neutral-900 tabular-nums tracking-tight"></p>
        <p class="text-xs text-neutral-500 mt-1">total spent</p>
      </div>
      <div class="overflow-y-auto flex-1">
        <table class="w-full text-sm">
          <thead class="sticky top-0 bg-white border-b border-neutral-100">
            <tr>
              <th class="px-5 py-2.5 text-left text-xs font-semibold text-neutral-500 uppercase tracking-wide">Date</th>
              <th class="px-5 py-2.5 text-left text-xs font-semibold text-neutral-500 uppercase tracking-wide">Merchant</th>
              <th class="px-5 py-2.5 text-right text-xs font-semibold text-neutral-500 uppercase tracking-wide">Amount</th>
            </tr>
          </thead>
          <tbody id="txn-panel-tbody" class="divide-y divide-neutral-50"></tbody>
        </table>
        <p id="txn-panel-empty" class="hidden text-center text-sm text-neutral-500 py-12">No transactions found.</p>
      </div>
      <div class="px-5 py-3 border-t border-neutral-100 shrink-0 flex justify-between items-center">
        <span class="text-xs text-neutral-500" id="txn-panel-count"></span>
        <span class="text-sm font-semibold text-neutral-800" id="txn-panel-total"></span>
      </div>
    </div>
  </aside>

  <!-- Profile / dataset switcher dropdown — shared by the desktop rail's
       #profile-btn and the mobile sticky-header #profile-badge-mobile. Positioned
       near whichever trigger opened it, by initProfileSwitcher() in app.js. -->
  <div id="profile-panel" class="hidden fixed z-50 min-w-[14rem] max-w-[18rem] bg-white border border-neutral-200 rounded-xl shadow-lg py-1"></div>

  <!-- Custom DOM tooltip — used by the hand-rolled SVG radial chart (mouse-event
       driven via showCustomTooltip). The Chart.js charts use #cjs-tip below. -->
  <div id="ct-tip" class="hidden fixed pointer-events-none z-50"></div>

  <!-- Chart.js native-tooltip target. Styled with the same .ct-tip classes via
       the external-tooltip callback (makeTipExternal in app.js). -->
  <div id="cjs-tip" class="hidden fixed pointer-events-none z-50"></div>

  {% block scripts %}{% endblock %}

  <!-- Service-worker registration — owned by the real app shell so the PWA's
       SW lifecycle tracks deploys. When skipWaiting() in the new SW makes it
       take control mid-session, controllerchange fires and we reload once
       (guarded) to swap in the fresh shell. -->
  <script>
    if ('serviceWorker' in navigator) {
      // Truthy only when this page is already SW-controlled at load (i.e. a
      // prior build is on screen). On a first-ever install it's null, so we
      // skip the reload — the page was just served fresh from the network.
      const _hadController = !!navigator.serviceWorker.controller;
      let _swReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_swReloaded || !_hadController) return;
        _swReloaded = true;
        window.location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
